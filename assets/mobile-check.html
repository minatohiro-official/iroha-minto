<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>スマホ表示確認</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#213a32;font-family:sans-serif}header{height:54px;padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:12px}select{font-size:14px;padding:6px}main{display:flex;justify-content:center}iframe{display:block;width:390px;height:844px;border:1px solid #b6c9bd;background:#fff}</style></head><body><header><label>ページ <select id="page"><option value="../index.html">トップ</option><option value="../services.html">料金</option><option value="../works.html">制作実績</option><option value="../contact.html">見積もり</option><option value="../sample-admin.html">管理デモ案内</option><option value="../sample-admin-app.html">管理Webアプリ</option></select></label><label>画面幅 <select id="size"><option>320</option><option selected>390</option><option>430</option><option>768</option></select></label></header><main><iframe id="qa-frame" title="スマホ表示の確認" src="../index.html"></iframe></main><script>const frame=document.querySelector('#qa-frame');document.querySelector('#size').addEventListener('change',event=>{frame.style.width=event.target.value+'px'});document.querySelector('#page').addEventListener('change',event=>{frame.src=event.target.value});</script></body></html>
